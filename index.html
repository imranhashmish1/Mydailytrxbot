<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Daily TRX</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= SPLASH ================= -->

  <div id="splash" class="splash">
    <div class="logo">₮</div>
    <h1>Daily TRX</h1>
    <div class="loader">
      <span></span>
    </div>
  </div>


  <!-- ================= REGISTRATION ================= -->

  <section
    id="registration"
    class="registration hidden"
  >

    <div class="register-box">

      <div class="register-logo">₮</div>

      <h1>Create Account</h1>

      <p class="register-sub">
        Register your Daily TRX account to continue.
      </p>


      <label for="regUsername">
        Username
      </label>

      <input
        id="regUsername"
        type="text"
        placeholder="Enter username"
        maxlength="30"
        autocomplete="username"
      >


      <label for="regEmail">
        Email
      </label>

      <input
        id="regEmail"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <label for="regPin">
        PIN
      </label>

      <input
        id="regPin"
        type="password"
        placeholder="4-6 digit PIN"
        inputmode="numeric"
        maxlength="6"
        autocomplete="new-password"
      >


      <label for="regPinConfirm">
        Confirm PIN
      </label>

      <input
        id="regPinConfirm"
        type="password"
        placeholder="Confirm your PIN"
        inputmode="numeric"
        maxlength="6"
        autocomplete="new-password"
      >


      <div
        id="registerMessage"
        class="register-message"
      ></div>


      <button
        id="registerBtn"
        class="register-btn"
        type="button"
      >
        Create Account
      </button>


      <small class="secure-text">
        🔒 Your account is securely connected to Telegram.
      </small>

    </div>

  </section>


  <!-- ================= MAIN APP ================= -->

  <main
    id="app"
    class="app hidden"
  >

    <!-- TOP BAR -->

    <header class="topbar">

      <div class="brand">

        <div class="mini-logo">
          ₮
        </div>

        <div class="brand-text">

          <b>DAILY TRX</b>

          <small>
            Investment Wallet
          </small>

        </div>

      </div>


      <div class="actions">

        <!-- IMPORTANT:
             app.js uses this exact ID
        -->

        <button
          id="themeButton"
          class="icon-btn"
          type="button"
          aria-label="Change theme"
        >
          ☾
        </button>

      </div>

    </header>


    <!-- ================= PAGE CONTENT ================= -->

    <!--
      IMPORTANT:
      app.js will completely control this area.
      Do NOT put Dashboard/Deposit/Wallet content here.
    -->

    <section
      id="page"
      class="panel"
    ></section>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom">

      <button
        type="button"
        data-page="home"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>


      <button
        type="button"
        data-page="wallet"
      >
        <span>▣</span>
        <small>Wallet</small>
      </button>


      <button
        type="button"
        data-page="deposit"
      >
        <span>＋</span>
        <small>Deposit</small>
      </button>


      <button
        type="button"
        data-page="investment"
      >
        <span>◈</span>
        <small>Invest</small>
      </button>


      <button
        type="button"
        data-page="profile"
      >
        <span>♙</span>
        <small>Profile</small>
      </button>

    </nav>

  </main>


  <!-- ================= REGISTRATION SCRIPT ================= -->

  <script>

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    const splash =
      document.getElementById("splash");

    const registration =
      document.getElementById("registration");

    const app =
      document.getElementById("app");


    /*
     * Splash
     */

    setTimeout(() => {

      splash?.classList.add("hidden");

      const registered =
        localStorage.getItem(
          "dailytrx_registered"
        ) === "true";


      if (registered) {

        app?.classList.remove("hidden");

      } else {

        registration?.classList.remove(
          "hidden"
        );

      }

    }, 900);


    /*
     * Registration
     */

    const registerButton =
      document.getElementById(
        "registerBtn"
      );


    registerButton?.addEventListener(
      "click",
      async () => {

        const username =
          document
            .getElementById("regUsername")
            ?.value
            .trim();


        const email =
          document
            .getElementById("regEmail")
            ?.value
            .trim();


        const pin =
          document
            .getElementById("regPin")
            ?.value
            .trim();


        const confirmPin =
          document
            .getElementById("regPinConfirm")
            ?.value
            .trim();


        const message =
          document.getElementById(
            "registerMessage"
          );


        message.textContent = "";
        message.className =
          "register-message";


        if (
          !username ||
          !email ||
          !pin ||
          !confirmPin
        ) {

          message.textContent =
            "Please complete all fields.";

          message.classList.add(
            "error"
          );

          return;
        }


        if (pin !== confirmPin) {

          message.textContent =
            "PINs do not match.";

          message.classList.add(
            "error"
          );

          return;
        }


        if (!/^\d{4,6}$/.test(pin)) {

          message.textContent =
            "PIN must contain 4-6 digits.";

          message.classList.add(
            "error"
          );

          return;
        }


        const telegramUser =
          tg?.initDataUnsafe?.user;


        if (!telegramUser?.id) {

          message.textContent =
            "Please open Daily TRX from Telegram.";

          message.classList.add(
            "error"
          );

          return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
          "Creating account...";


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({

                    telegram_chat_id:
                      String(
                        telegramUser.id
                      ),

                    username:
                      username,

                    email:
                      email,

                    pin:
                      pin

                  })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.ok
          ) {

            throw new Error(
              data.message ||
              "Registration failed"
            );

          }


          localStorage.setItem(
            "dailytrx_registered",
            "true"
          );


          localStorage.setItem(
            "dailytrx_username",
            username
          );


          registration.classList.add(
            "hidden"
          );


          app.classList.remove(
            "hidden"
          );


          /*
           * app.js will now render Home.
           */

          if (
            typeof window.render ===
            "function"
          ) {

            window.render("home");

          }


        } catch (error) {

          message.textContent =
            error.message ||
            "Registration failed.";

          message.classList.add(
            "error"
          );


          registerButton.disabled =
            false;

          registerButton.textContent =
            "Create Account";

        }

      }
    );

  </script>


  <!-- ================= MAIN APP JS ================= -->

  <script src="app.js"></script>

</body>
</html>
