<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0d12">

  <title>Daily TRX</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css?v=20260926-02">
</head>

<body>

  <!-- =========================
       SPLASH SCREEN
  ========================== -->
  <div id="splash" class="splash">

    <div class="splash-logo">
      <span>₮</span>
    </div>

    <h1>Daily TRX</h1>

    <p>TRX Investment Platform</p>

    <div class="loader">
      <span></span>
    </div>

  </div>


  <!-- =========================
       REGISTRATION
  ========================== -->
  <section id="registration" class="registration hidden">

    <div class="register-card">

      <div class="register-logo">
        ₮
      </div>

      <h1>Welcome to Daily TRX</h1>

      <p class="register-subtitle">
        Create your account to continue
      </p>

      <div class="form-group">

        <label for="regUsername">
          Username
        </label>

        <input
          id="regUsername"
          type="text"
          autocomplete="username"
          placeholder="Enter username"
          maxlength="30"
        >

      </div>


      <div class="form-group">

        <label for="regEmail">
          Email
        </label>

        <input
          id="regEmail"
          type="email"
          autocomplete="email"
          placeholder="Enter email"
        >

      </div>


      <div class="form-group">

        <label for="regPin">
          PIN
        </label>

        <input
          id="regPin"
          type="password"
          inputmode="numeric"
          autocomplete="new-password"
          placeholder="4–6 digit PIN"
          maxlength="6"
        >

      </div>


      <div class="form-group">

        <label for="regConfirmPin">
          Confirm PIN
        </label>

        <input
          id="regConfirmPin"
          type="password"
          inputmode="numeric"
          autocomplete="new-password"
          placeholder="Confirm your PIN"
          maxlength="6"
        >

      </div>


      <div class="form-group">

        <label for="regReferral">
          Referral Code
          <span class="optional">Optional</span>
        </label>

        <input
          id="regReferral"
          type="text"
          placeholder="Referral code"
          maxlength="30"
        >

      </div>


      <button
        id="registerButton"
        class="primary-button"
        type="button"
      >
        Create Account
      </button>


      <div
        id="registerMessage"
        class="form-message"
      ></div>

    </div>

  </section>


  <!-- =========================
       MAIN APP
  ========================== -->
  <main id="app" class="app hidden">

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="brand">

        <div class="brand-logo">
          ₮
        </div>

        <div class="brand-text">

          <strong>Daily TRX</strong>

          <small id="headerUsername">
            Dashboard
          </small>

        </div>

      </div>


      <div class="top-actions">

        <button
          id="notificationButton"
          class="icon-button"
          type="button"
          aria-label="Notifications"
        >
          🔔
          <span
            id="notificationBadge"
            class="notification-badge hidden"
          >
            0
          </span>
        </button>


        <button
          id="themeButton"
          class="icon-button"
          type="button"
          aria-label="Theme"
        >
          🌙
        </button>

      </div>

    </header>


    <!-- PAGE CONTENT -->
    <section id="page" class="page"></section>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

      <button
        type="button"
        data-page="home"
        class="nav-button active"
      >
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>


      <button
        type="button"
        data-page="wallet"
        class="nav-button"
      >
        <span class="nav-icon">◈</span>
        <span>Wallet</span>
      </button>


      <button
        type="button"
        data-page="investment"
        class="nav-button"
      >
        <span class="nav-icon">▣</span>
        <span>Invest</span>
      </button>


      <button
        type="button"
        data-page="profile"
        class="nav-button"
      >
        <span class="nav-icon">◉</span>
        <span>Profile</span>
      </button>

    </nav>

  </main>


  <!-- CURRENT APP LOGIC -->
  <script src="app.js?v=20260926-02"></script>

</body>
</html>
