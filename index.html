<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Daily TRX</title>

  <meta name="theme-color" content="#0b1020" />

  <link rel="stylesheet" href="style.css" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <!-- Registration -->
  <section id="registration" class="registration hidden">

    <div class="register-card">

      <div class="brand-large">
        <div class="brand-icon">₮</div>
        <h1>Daily TRX</h1>
        <p>Create your account</p>
      </div>

      <div class="input-group">
        <label>Username</label>
        <input
          id="regUsername"
          type="text"
          placeholder="Enter username"
          maxlength="30"
          autocomplete="off"
        />
      </div>

      <div class="input-group">
        <label>Email</label>
        <input
          id="regEmail"
          type="email"
          placeholder="Enter email"
          autocomplete="email"
        />
      </div>

      <div class="input-group">
        <label>PIN</label>
        <input
          id="regPin"
          type="password"
          placeholder="4–6 digit PIN"
          inputmode="numeric"
          maxlength="6"
        />
      </div>

      <div class="input-group">
        <label>Confirm PIN</label>
        <input
          id="regConfirmPin"
          type="password"
          placeholder="Confirm PIN"
          inputmode="numeric"
          maxlength="6"
        />
      </div>

      <input id="regReferral" type="hidden" />

      <button id="registerButton" class="primary-button">
        Create Account
      </button>

      <p id="registerMessage" class="form-message"></p>

    </div>

  </section>


  <!-- Main App -->
  <main id="app" class="app app-hidden">

    <div id="page"></div>

  </main>


  <script src="app.js"></script>

</body>
</html>
