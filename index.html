<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#07111f"
  >

  <title>Daily TRX</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link
    rel="stylesheet"
    href="style.css?v=20260926"
  >
</head>

<body>

  <!-- =========================
       MAIN APP
  ========================== -->

  <main id="app" class="app">

    <section id="page"></section>

  </main>


  <!-- =========================
       REGISTRATION
  ========================== -->

  <section
    id="registration"
    class="registration hidden"
  >

    <div class="register-box">

      <div class="register-logo">
        ₮
      </div>

      <h1>
        Create Account
      </h1>

      <p class="register-sub">
        Register your Daily TRX account to continue.
      </p>


      <label for="regUsername">
        Username
      </label>

      <input
        id="regUsername"
        type="text"
        placeholder="Enter username"
        maxlength="30"
        autocomplete="username"
      >


      <label for="regEmail">
        Email
      </label>

      <input
        id="regEmail"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <label for="regPin">
        PIN
      </label>

      <input
        id="regPin"
        type="password"
        placeholder="4-6 digit PIN"
        inputmode="numeric"
        maxlength="6"
        autocomplete="new-password"
      >


      <label for="regPinConfirm">
        Confirm PIN
      </label>

      <input
        id="regPinConfirm"
        type="password"
        placeholder="Confirm your PIN"
        inputmode="numeric"
        maxlength="6"
        autocomplete="new-password"
      >


      <div
        id="registerMessage"
        class="register-message"
      ></div>


      <button
        id="registerBtn"
        class="register-btn"
        type="button"
      >
        Create Account
      </button>


      <small class="secure-text">
        🔒 Your account is securely connected to Telegram.
      </small>

    </div>

  </section>


  <!-- =========================
       APP LOGIC
  ========================== -->

  <script src="app.js?v=20260926"></script>

</body>
</html>
